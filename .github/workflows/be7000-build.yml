name: Build OpenWrt for Xiaomi BE7000 with AmneziaWG

on:
  workflow_dispatch:
  push:
    branches: [ main ]

env:
  SRC_REPO: https://github.com/dima424658/openwrt-be7000.git
  SRC_BRANCH: main

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Освободить место на раннере
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          sudo docker image prune -a -f || true
          df -h /

      - name: Зависимости сборки
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget \
            libelf-dev ecj fastjar java-propose-classpath device-tree-compiler \
            python3-distutils-extra

      - name: Клонировать ветку с поддержкой BE7000
        run: |
          git clone --depth 1 -b "$SRC_BRANCH" "$SRC_REPO" owrt
          cd owrt
          git log --oneline -1
          test -f target/linux/qualcommbe/dts/ipq9574-be7000.dts \
            || { echo "!!! DTS BE7000 не найден в ветке"; exit 1; }

      - name: Feeds + AmneziaWG
        working-directory: owrt
        run: |
          echo "src-git awg https://github.com/Slava-Shchipunov/awg-openwrt.git" >> feeds.conf.default
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          ./scripts/feeds install -a -p awg

      - name: Конфигурация
        working-directory: owrt
        run: |
          cat > .config <<'EOF'
          CONFIG_TARGET_qualcommbe=y
          CONFIG_TARGET_qualcommbe_ipq95xx=y
          CONFIG_TARGET_qualcommbe_ipq95xx_DEVICE_xiaomi_be7000=y
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-ssl=y
          CONFIG_PACKAGE_kmod-amneziawg=y
          CONFIG_PACKAGE_amneziawg-tools=y
          CONFIG_PACKAGE_luci-proto-amneziawg=y
          EOF
          make defconfig
          grep -q "CONFIG_TARGET_qualcommbe_ipq95xx_DEVICE_xiaomi_be7000=y" .config \
            || { echo "!!! Профиль BE7000 не подхватился"; exit 1; }
          for p in kmod-amneziawg amneziawg-tools luci-proto-amneziawg; do
            grep -q "^CONFIG_PACKAGE_$p=y" .config || { echo "!!! Пакет $p не выбран"; exit 1; }
          done

      - name: Скачать исходники пакетов
        working-directory: owrt
        run: make -j$(nproc) download

      - name: Сборка
        working-directory: owrt
        run: make -j$(nproc) || make -j1 V=s

      - name: Что получилось
        working-directory: owrt
        run: ls -l bin/targets/qualcommbe/ipq95xx/

      - uses: actions/upload-artifact@v4
        with:
          name: openwrt-xiaomi-be7000-amneziawg
          path: |
            owrt/bin/targets/qualcommbe/ipq95xx/*
          if-no-files-found: error
